name: Build Windows exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write  # needed to publish a release
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python test_otel.py
        env:
          PYTHONUTF8: "1"
      # A tag like v3 is a release: the program learns its own version number (3).
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i "s/^APP_VERSION = .*/APP_VERSION = \"${GITHUB_REF_NAME#v}\"/" otel.py && grep -n "^APP_VERSION" otel.py
      - run: pyinstaller --onefile --windowed --name OtelYonetim otel.py
      - uses: actions/upload-artifact@v4
        with:
          name: OtelYonetim
          path: dist/OtelYonetim.exe
      # Only tagged builds reach the hotel: the update button downloads the latest release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/OtelYonetim.exe --title "Sürüm ${GITHUB_REF_NAME#v}" --notes ""
